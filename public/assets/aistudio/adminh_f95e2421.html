<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>OrientEck · Admin Workspace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<script type="module" src="/src/main.tsx"></script>
<style>
:root{--bg:#091710;--panel:#10251a;--panel2:#142d20;--paper:#f7f2e7;--cream:#ede4d2;--gold:#d9b66a;--gold2:#f0d998;--goldDark:#a97a33;--text:#18271d;--muted:#7c877d;--white:#f9f5ea;--line:rgba(217,182,106,.2);--shadow:0 24px 70px rgba(0,0,0,.24);--serif:'Cormorant Garamond',Georgia,serif;--sans:'Hanken Grotesk',Arial,sans-serif}
*{box-sizing:border-box}html{min-height:100%;background:var(--bg)}body{margin:0;min-height:100vh;background:radial-gradient(900px 520px at 10% -5%,rgba(38,99,64,.22),transparent 65%),var(--bg);font:14px/1.5 var(--sans);color:var(--white);-webkit-font-smoothing:antialiased}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}a{color:inherit;text-decoration:none}.hidden{display:none!important}

/* app shell */
.app{min-height:100vh;display:grid;grid-template-columns:250px minmax(0,1fr)}.sidebar{height:100vh;position:sticky;top:0;background:rgba(7,19,12,.94);border-right:1px solid rgba(255,255,255,.08);padding:24px 16px;display:flex;flex-direction:column;z-index:40}.side-brand{display:flex;align-items:center;gap:12px;padding:0 9px 24px}.side-brand .brand-mark{width:42px;height:42px;border-radius:14px;flex:none}.brand-mark{width:50px;height:50px;display:grid;place-items:center;border-radius:17px;background:linear-gradient(135deg,#f0d998,#d9b66a 54%,#a97a33);color:#211809;font:700 26px var(--serif);box-shadow:0 10px 25px rgba(217,182,106,.18)}.side-brand strong{display:block;font:600 23px/1 var(--serif);letter-spacing:.02em}.side-brand small{display:block;font-size:9px;color:var(--gold);letter-spacing:.16em;text-transform:uppercase;margin-top:5px}.side-label{font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:#68796d;padding:8px 12px 10px;font-weight:700}.side-nav{display:grid;gap:5px}.nav-item{display:flex;align-items:center;gap:12px;width:100%;border:1px solid transparent;padding:12px 13px;border-radius:12px;text-align:left;background:transparent;color:rgba(249,245,234,.7);font-weight:600;transition:all .2s}.nav-item svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;flex:none}.nav-item:hover{background:rgba(255,255,255,.05);color:var(--white)}.nav-item.active{background:linear-gradient(110deg,rgba(217,182,106,.18),rgba(217,182,106,.05));border-color:rgba(217,182,106,.25);color:var(--gold2)}.nav-item .count{margin-left:auto;min-width:22px;text-align:center;background:rgba(217,182,106,.14);border-radius:30px;padding:2px 7px;font-size:10px;color:var(--gold2);font-weight:700}.nav-item .count.has-new{background:#d9b66a;color:#102319}.side-bottom{margin-top:auto}.server-pill{display:flex;gap:9px;align-items:center;border-top:1px solid rgba(255,255,255,.08);padding:18px 11px;color:#89988d;font-size:11px}.dot{width:7px;height:7px;border-radius:50%;background:#8dd59d;box-shadow:0 0 0 4px rgba(141,213,157,.15);animation:pulse 2s infinite}@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(141,213,157,.4)}70%{box-shadow:0 0 0 6px rgba(141,213,157,0)}100%{box-shadow:0 0 0 0 rgba(141,213,157,0)}}.side-bottom .nav-item{margin-bottom:7px}
.main{min-width:0;min-height:100vh}.mobile-menu{display:none;width:42px;height:42px;border-radius:12px;border:1px solid rgba(217,182,106,.28);background:rgba(16,37,26,.96);color:var(--gold2);box-shadow:0 10px 28px rgba(0,0,0,.22)}.mobile-menu svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2}.content{padding:clamp(24px,3.2vw,46px);max-width:1700px;margin:0 auto}.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin-bottom:26px}.page-head h2{margin:0;font:600 clamp(28px,4vw,44px)/.95 var(--serif);letter-spacing:-.03em}.page-head p{margin:9px 0 0;color:#91a095;font-size:12px}.page-actions{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.toolbar-search{width:min(100%,290px);position:relative}.toolbar-search input{padding-left:37px;min-height:42px;background:#102319}.toolbar-search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:15px;height:15px;stroke:#85958a;fill:none;stroke-width:2}

/* Buttons and inputs */
.primary{border:1px solid transparent;border-radius:11px;min-height:44px;padding:11px 17px;background:linear-gradient(135deg,#f0d998,#d9b66a 55%,#a97a33);color:#211809;font-weight:700;box-shadow:0 10px 24px rgba(217,182,106,.15);transition:transform .2s,filter .2s;display:inline-flex;align-items:center;justify-content:center;gap:6px}.primary:hover{transform:translateY(-1px);filter:brightness(1.05)}.primary:disabled{opacity:.5;cursor:not-allowed}.secondary{min-height:42px;border:1px solid rgba(217,182,106,.35);border-radius:11px;padding:10px 14px;background:rgba(217,182,106,.07);color:var(--gold2);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px}.secondary:hover{background:rgba(217,182,106,.15)}.danger{border:1px solid rgba(227,118,101,.35);background:rgba(171,63,49,.15);color:#ffb7a9;border-radius:10px;padding:8px 11px;font-weight:600}.field{display:grid;gap:7px;margin-bottom:15px}.field label{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#8f9c91}.field input,.field select,.field textarea,.toolbar-search input{width:100%;min-height:46px;padding:12px 14px;background:#0b1b12;border:1px solid rgba(255,255,255,.13);border-radius:11px;color:var(--white);outline:none}.field textarea{min-height:100px;resize:vertical}.field input:focus,.field select:focus,.field textarea:focus{border-color:rgba(217,182,106,.75);box-shadow:0 0 0 3px rgba(217,182,106,.1)}

/* Cards and tables */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px;margin-bottom:25px}.stat{position:relative;overflow:hidden;background:linear-gradient(145deg,rgba(21,48,32,.9),rgba(13,31,21,.96));border:1px solid rgba(217,182,106,.18);border-radius:18px;padding:21px;min-height:140px;cursor:pointer;transition:transform .2s,border-color .2s}.stat:hover{transform:translateY(-2px);border-color:rgba(217,182,106,.45)}.stat:after{content:"";position:absolute;right:-25px;top:-34px;width:110px;height:110px;border:1px solid rgba(217,182,106,.15);border-radius:50%;box-shadow:0 0 0 20px rgba(217,182,106,.025),0 0 0 40px rgba(217,182,106,.018)}.stat-top{display:flex;justify-content:space-between;align-items:center;color:#9ca99e;font-size:11px;font-weight:600;gap:8px}.stat-icon{width:36px;height:36px;border-radius:11px;background:rgba(217,182,106,.12);display:grid;place-items:center;color:var(--gold2)}.stat-icon svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8}.stat-number{font:600 clamp(32px,4vw,42px)/1 var(--serif);margin-top:16px}.stat-note{font-size:10px;color:#819185;margin-top:8px;display:flex;align-items:center;gap:6px}.grid-two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin-bottom:25px}.panel{min-width:0;background:rgba(16,37,26,.88);border:1px solid rgba(255,255,255,.08);border-radius:18px;overflow:hidden;margin-bottom:24px}.panel-head{padding:18px 22px;display:flex;align-items:center;justify-content:space-between;gap:15px;border-bottom:1px solid rgba(255,255,255,.07)}.panel-head h3{margin:0;font:600 24px/1 var(--serif)}.panel-head p{margin:5px 0 0;color:#819186;font-size:11px}.link-btn{border:0;background:transparent;color:var(--gold2);font-size:11px;font-weight:700;white-space:nowrap;cursor:pointer;padding:4px 8px;border-radius:6px}.link-btn:hover{background:rgba(217,182,106,.1)}.panel-body{padding:18px 22px}.table-wrap{overflow-x:auto}.data-table{width:100%;border-collapse:collapse;min-width:650px}.data-table th{text-align:left;padding:13px 16px;font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:#7f8f83;border-bottom:1px solid rgba(255,255,255,.07);white-space:nowrap}.data-table td{padding:14px 16px;border-bottom:1px solid rgba(255,255,255,.055);font-size:12px;vertical-align:middle}.data-table tr:last-child td{border-bottom:0}.data-table tbody tr:hover{background:rgba(255,255,255,.025)}.dish-cell{display:flex;align-items:center;gap:11px;min-width:200px}.dish-thumb{width:42px;height:42px;border-radius:12px;background:#1f3d2b;object-fit:cover;display:grid;place-items:center;overflow:hidden;flex:none;color:var(--gold2)}.dish-thumb img{width:100%;height:100%;object-fit:cover}.dish-cell strong{display:block;font-size:12px;color:#f4efdf}.dish-cell small{display:block;font-size:10px;color:#849286;margin-top:4px}.money{font-weight:700;white-space:nowrap;color:var(--gold2)}.muted{color:#8b9a8f}.empty{padding:43px 18px;text-align:center;color:#8b9a8f}.empty strong{display:block;color:var(--white);font:600 27px var(--serif);margin-bottom:8px}.badge{display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border-radius:30px;font-size:10px;font-weight:700;white-space:nowrap;background:rgba(217,182,106,.1);color:var(--gold2);border:1px solid rgba(217,182,106,.15)}.badge.green{background:rgba(66,156,92,.15);border-color:rgba(116,204,137,.25);color:#9de0aa}.badge.red{background:rgba(193,76,60,.15);border-color:rgba(238,128,111,.25);color:#ffb4a6}.badge.gray{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.1);color:#a0aaa2}.row-actions{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.icon-btn{height:33px;width:33px;display:grid;place-items:center;border-radius:9px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);color:#cdd5cb}.icon-btn:hover{border-color:var(--line);color:var(--gold2)}.icon-btn svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.8}.status-select{min-height:34px;padding:6px 24px 6px 9px;background:#0d1f14;color:#e6ebdf;border:1px solid rgba(217,182,106,.3);border-radius:8px;font-size:11px;font-weight:600;cursor:pointer}.status-select:focus{border-color:var(--gold2)}.toolbar{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;padding:16px 20px;border-bottom:1px solid rgba(255,255,255,.065)}.filter-row{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;max-width:100%}.filter-chip{flex:none;border:1px solid rgba(255,255,255,.1);border-radius:30px;padding:8px 12px;background:transparent;color:#a8b2a8;font-size:10px;font-weight:600}.filter-chip.active,.filter-chip:hover{background:rgba(217,182,106,.15);border-color:rgba(217,182,106,.4);color:var(--gold2)}.table-foot{padding:13px 20px;color:#7c8b80;border-top:1px solid rgba(255,255,255,.05);font-size:10px}

/* form and modal */
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 16px}.field.full{grid-column:1/-1}.field .hint{font-size:10px;color:#89978b}.check-row{display:flex;align-items:flex-start;gap:10px;padding:11px 0;color:#d2dacf;font-size:12px}.check-row input{accent-color:var(--gold);width:16px;height:16px;margin:2px 0 0}.image-preview{width:100%;height:145px;display:grid;place-items:center;border-radius:14px;background:#0b1b12;border:1px dashed rgba(217,182,106,.25);overflow:hidden;color:#7f8e83}.image-preview img{width:100%;height:100%;object-fit:cover}.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(8px);z-index:100;display:grid;place-items:center;padding:20px}.modal{width:min(100%,720px);max-height:min(92vh,900px);overflow:auto;background:#10251a;border:1px solid rgba(217,182,106,.3);border-radius:20px;box-shadow:0 35px 90px rgba(0,0,0,.6)}.modal-head{position:sticky;top:0;z-index:1;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:20px 24px;background:rgba(16,37,26,.97);border-bottom:1px solid rgba(255,255,255,.08)}.modal-head h3{margin:0;font:600 28px/1 var(--serif)}.eyebrow{color:var(--gold2);letter-spacing:.18em;text-transform:uppercase;font-size:10px;font-weight:700}.close{width:34px;height:34px;border:1px solid rgba(255,255,255,.11);background:rgba(255,255,255,.04);color:white;border-radius:10px}.modal-form{padding:23px 24px}.modal-actions{position:sticky;bottom:0;padding:15px 24px;background:rgba(16,37,26,.97);border-top:1px solid rgba(255,255,255,.08);display:flex;justify-content:space-between;gap:12px}.modal-actions>div{display:flex;gap:8px}.toast{position:fixed;right:24px;bottom:24px;z-index:200;max-width:min(440px,calc(100vw - 32px));padding:14px 18px;border-radius:12px;background:#f7f2e7;color:#14251a;font-weight:700;box-shadow:0 15px 40px rgba(0,0,0,.35);opacity:0;transform:translateY(14px);pointer-events:none;transition:.25s}.toast.show{opacity:1;transform:none}.toast.error{background:#ffe3dc;color:#782d23}.note-box{border:1px solid rgba(217,182,106,.16);background:rgba(217,182,106,.045);border-radius:13px;padding:15px;color:#a9b3a7;font-size:11px;line-height:1.7}.note-box strong{color:var(--gold2)}
.simple-list{display:grid}.simple-row{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid rgba(255,255,255,.06)}.simple-row:last-child{border:0}.simple-icon{width:39px;height:39px;border-radius:12px;display:grid;place-items:center;flex:none;background:rgba(217,182,106,.09);color:var(--gold2)}.simple-icon svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.7}.simple-main{min-width:0;flex:1}.simple-main strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px}.simple-main small{display:block;color:#819186;font-size:10px;margin-top:4px}
.quick-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-top:14px}
.quick-card{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);border-radius:12px;padding:12px;display:flex;align-items:center;gap:10px}

@media(max-width:1100px){.app{grid-template-columns:220px minmax(0,1fr)}.sidebar{padding-inline:12px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.grid-two{grid-template-columns:1fr}.content{padding:24px}.stat{min-height:130px}}
@media(max-width:760px){.dashboard-head{position:relative}.dashboard-head .page-actions{position:fixed;top:14px;right:14px;z-index:61;width:auto;justify-content:flex-end}.dashboard-head .page-actions .secondary{min-height:42px;padding:9px 13px;white-space:nowrap}.app{display:block}.sidebar{position:fixed;left:0;top:0;bottom:0;width:min(290px,86vw);height:100dvh;transform:translateX(-105%);transition:transform .25s;box-shadow:var(--shadow)}.app.nav-open .sidebar{transform:none}.app.nav-open:after{content:"";position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:30}.mobile-menu{display:grid;place-items:center;position:fixed;top:14px;left:14px;z-index:60}.content{padding:72px 14px 36px}.page-head{align-items:flex-start;flex-direction:column;margin-bottom:20px}.page-actions{width:100%}.toolbar-search{width:100%;flex:1}.stats{gap:10px}.stat{padding:16px;min-height:115px;border-radius:15px}.stat-number{font-size:32px;margin-top:12px}.stat-top{font-size:10px}.stat-icon{width:30px;height:30px}.panel-head{padding:16px}.panel-body{padding:14px 16px}.toolbar{padding:14px;align-items:flex-start}.filter-row{width:100%}.data-table{min-width:660px}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.modal-backdrop{padding:8px;align-items:end}.modal{max-height:94dvh;border-radius:20px 20px 13px 13px}.modal-head,.modal-form{padding:18px}.modal-actions{padding:13px 18px}}
</style>
</head>
<body>
<div class="app" id="appShell">
  <aside class="sidebar" id="sidebar">
    <div class="side-brand"><div class="brand-mark">O</div><div><strong>OrientEck</strong><small>Admin workspace</small></div></div>
    <div class="side-label">Workspace Menu</div>
    <nav class="side-nav" id="sideNav">
      <button class="nav-item active" data-section="dashboard">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>
        Overview & Activity
      </button>
      <button class="nav-item" data-section="orders">
        <svg viewBox="0 0 24 24"><path d="M5 7h14l1 13H4L5 7z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>
        Orders<span class="count" id="orderCount">0</span>
      </button>
      <button class="nav-item" data-section="reservations">
        <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4M17 3v4M3 10h18M8 14h3M8 17h6"/></svg>
        Reservations<span class="count" id="reservationCount">0</span>
      </button>
      <button class="nav-item" data-section="messages">
        <svg viewBox="0 0 24 24"><path d="M4 5h16v12H8l-4 3z"/><path d="M8 9h8M8 13h5"/></svg>
        Messages<span class="count" id="messageCount">0</span>
      </button>
      <button class="nav-item" data-section="menu">
        <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h7"/></svg>
        Food Catalogue<span class="count" id="menuCount">0</span>
      </button>
      <button class="nav-item" data-section="foodadd">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/><circle cx="12" cy="12" r="9"/></svg>
        Add Food & Cat
      </button>
    </nav>
    <div class="side-bottom">
      <button class="nav-item" id="sidebarRefreshBtn" type="button" style="color:var(--gold2);margin-bottom:8px">
        <svg viewBox="0 0 24 24"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M5.6 9a7 7 0 0 1 11.8-2L20 12M4 12l2.6 5a7 7 0 0 0 11.8-2"/></svg>
        Sync Database
      </button>
      <a href="/" target="_blank" class="nav-item" style="color:var(--gold2);margin-bottom:8px">
        <svg viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
        Live Customer Site ↗
      </a>
      <div class="server-pill"><i class="dot"></i><span id="liveStatusText">Live database sync active</span></div>
    </div>
  </aside>
  <main class="main">
    <button class="mobile-menu" id="mobileMenu" type="button" aria-label="Open navigation" title="Open navigation">
      <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <div class="content" id="mainContent"><div class="empty">Loading workspace & database…</div></div>
  </main>
</div>
<div class="modal-backdrop hidden" id="modalBackdrop" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
  const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
  const state={section:'dashboard',menu:[],orders:[],reservations:[],messages:[],query:'',filter:'all',modalImage:'',toastTimer:null};
  const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const money=v=>new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR'}).format(Number(v)||0);
  const date=v=>{if(!v)return '—';const d=new Date(v);return Number.isNaN(+d)?esc(v):d.toLocaleString('en-GB',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});};
  const slug=v=>String(v||'other').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'other';

  const API_BASE = (window.location && window.location.protocol && window.location.protocol.startsWith('http')) ? '' : 'http://localhost:3000';

  let audioCtx = null;
  function getAudioContext() {
    if (!audioCtx) {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (AudioCtx) {
        audioCtx = new AudioCtx();
      }
    }
    if (audioCtx && audioCtx.state === 'suspended') {
      audioCtx.resume().catch(() => {});
    }
    return audioCtx;
  }

  const unlockAudio = () => {
    const ctx = getAudioContext();
    if (ctx && ctx.state === 'suspended') {
      ctx.resume().catch(() => {});
    }
  };
  ['click', 'touchstart', 'keydown'].forEach(evt => {
    document.addEventListener(evt, unlockAudio, { passive: true });
  });

  function playChime() {
    try {
      const ctx = getAudioContext();
      if (!ctx) return;
      if (ctx.state === 'suspended') {
        ctx.resume().catch(() => {});
      }
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(587.33, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.12);
      gain.gain.setValueAtTime(0.2, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.38);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.4);
    } catch(e) {
      console.warn('Audio chime notice:', e);
    }
  }

  function waitForDb() {
    return new Promise(resolve => {
      if (window.OrientEckDb || window.dbService) {
        return resolve(window.OrientEckDb || window.dbService);
      }
      const onReady = e => {
        resolve((e && e.detail) || window.OrientEckDb || window.dbService);
      };
      window.addEventListener('dbservice:ready', onReady, { once: true });
      let checks = 0;
      const poll = setInterval(() => {
        checks++;
        if (window.OrientEckDb || window.dbService) {
          clearInterval(poll);
          window.removeEventListener('dbservice:ready', onReady);
          resolve(window.OrientEckDb || window.dbService);
        } else if (checks > 40) {
          clearInterval(poll);
          resolve(null);
        }
      }, 50);
    });
  }

  async function api(url, opts = {}) {
    const db = window.OrientEckDb || window.dbService;
    const cleanUrl = url.split('?')[0];
    const method = (opts.method || 'GET').toUpperCase();

    // Direct Firestore Database operations with immediate real-time synchronization
    if (db) {
      if (cleanUrl === '/api/menu' && method === 'GET') {
        if (typeof db.fetchDishesList === 'function') {
          return await db.fetchDishesList();
        }
      } else if (cleanUrl === '/api/orders' && method === 'GET') {
        if (typeof db.fetchOrdersList === 'function') {
          return await db.fetchOrdersList();
        }
      } else if (cleanUrl === '/api/reservations' && method === 'GET') {
        if (typeof db.fetchReservationsList === 'function') {
          return await db.fetchReservationsList();
        }
      } else if (cleanUrl === '/api/messages' && method === 'GET') {
        if (typeof db.fetchMessagesList === 'function') {
          return await db.fetchMessagesList();
        }
      } else if (cleanUrl === '/api/admin/menu' && method === 'POST') {
        const body = typeof opts.body === 'string' ? JSON.parse(opts.body) : (opts.body || {});
        if (typeof db.saveDishItem === 'function') {
          const id = await db.saveDishItem(body);
          return { ok: true, id };
        }
      } else if (cleanUrl.startsWith('/api/admin/menu/') && method === 'DELETE') {
        const id = decodeURIComponent(cleanUrl.replace('/api/admin/menu/', ''));
        if (typeof db.deleteDish === 'function') {
          await db.deleteDish(id);
          return { ok: true };
        }
      } else if (cleanUrl.startsWith('/api/admin/orders/') && (method === 'PATCH' || method === 'POST')) {
        const id = decodeURIComponent(cleanUrl.replace('/api/admin/orders/', ''));
        const body = typeof opts.body === 'string' ? JSON.parse(opts.body) : (opts.body || {});
        if (typeof db.updateOrderStatus === 'function') {
          await db.updateOrderStatus(id, body.status);
          return { ok: true };
        }
      } else if (cleanUrl.startsWith('/api/admin/reservations/') && (method === 'PATCH' || method === 'POST')) {
        const id = decodeURIComponent(cleanUrl.replace('/api/admin/reservations/', ''));
        const body = typeof opts.body === 'string' ? JSON.parse(opts.body) : (opts.body || {});
        if (typeof db.updateReservationStatus === 'function') {
          await db.updateReservationStatus(id, body.status);
          return { ok: true };
        }
      } else if (cleanUrl.startsWith('/api/admin/messages/') && (method === 'PATCH' || method === 'POST')) {
        const id = decodeURIComponent(cleanUrl.replace('/api/admin/messages/', ''));
        const body = typeof opts.body === 'string' ? JSON.parse(opts.body) : (opts.body || {});
        if (typeof db.updateMessageStatus === 'function') {
          await db.updateMessageStatus(id, body.status);
          return { ok: true };
        }
      }
    }

    const sep = url.includes('?') ? '&' : '?';
    const targetUrl = (url.startsWith('http') ? url : (API_BASE + url)) + sep + '_t=' + Date.now();
    const config = { cache: 'no-store', ...opts, headers: { ...(opts.body ? { 'Content-Type': 'application/json' } : {}), ...(opts.headers || {}) } };
    try {
      const res = await fetch(targetUrl, config);
      let data = {};
      try { data = await res.json(); } catch {}
      if (!res.ok) throw new Error(data.error || `Request failed (${res.status})`);
      return data;
    } catch (err) {
      if (db) {
        return [];
      }
      throw err;
    }
  }

  function toast(message, error = false) {
    const box = $('#toast');
    if (!box) return;
    box.textContent = message;
    box.classList.toggle('error', error);
    box.classList.add('show');
    clearTimeout(state.toastTimer);
    state.toastTimer = setTimeout(() => box.classList.remove('show'), 4200);
  }

  function badge(status) {
    const s = String(status || 'New');
    let tone = '';
    if (['Available', 'Delivered', 'Confirmed', 'Completed', 'Read', 'Replied'].includes(s)) tone = 'green';
    else if (['Unavailable', 'Cancelled', 'Declined', 'Archived'].includes(s)) tone = 'red';
    else if (['New', 'Preparing', 'Out for delivery', 'Pending'].includes(s)) tone = '';
    else tone = 'gray';
    return `<span class="badge ${tone}">${esc(s)}</span>`;
  }

  }

  function updateBadges() {
    const newOrders = (state.orders || []).filter(x => ['New', 'Pending', 'Preparing'].includes(x.status)).length;
    const newRes = (state.reservations || []).filter(x => ['New', 'Pending'].includes(x.status)).length;
    const newMsgs = (state.messages || []).filter(x => ['New', 'Pending'].includes(x.status)).length;

    const ordBadge = $('#orderCount');
    if (ordBadge) { ordBadge.textContent = newOrders; ordBadge.classList.toggle('has-new', newOrders > 0); }
    const resBadge = $('#reservationCount');
    if (resBadge) { resBadge.textContent = newRes; resBadge.classList.toggle('has-new', newRes > 0); }
    const msgBadge = $('#messageCount');
    if (msgBadge) { msgBadge.textContent = newMsgs; msgBadge.classList.toggle('has-new', newMsgs > 0); }
    const menuBadge = $('#menuCount');
    if (menuBadge) { menuBadge.textContent = (state.menu || []).length; }
  }

  const knownOrderIds = new Set();
  const knownResIds = new Set();
  const knownMsgIds = new Set();
  let initialOrderLoaded = false;
  let initialResLoaded = false;
  let initialMsgLoaded = false;

  function processIncomingOrders(orders, isInitial = false) {
    if (!Array.isArray(orders)) return;
    state.orders = orders;
    updateBadges();

    if (isInitial || !initialOrderLoaded) {
      orders.forEach(o => knownOrderIds.add(String(o.id)));
      initialOrderLoaded = true;
    } else {
      const newOrders = orders.filter(o => !knownOrderIds.has(String(o.id)));
      if (newOrders.length > 0) {
        playChime();
        const newest = newOrders[0];
        toast(`🔔 New Order #${newest?.nr || newest?.orderNumber || ''} received from ${newest?.name || 'Customer'}!`);
        newOrders.forEach(o => knownOrderIds.add(String(o.id)));
      }
    }
    renderActiveSection(true);
  }

  function processIncomingReservations(reservations, isInitial = false) {
    if (!Array.isArray(reservations)) return;
    state.reservations = reservations;
    updateBadges();

    if (isInitial || !initialResLoaded) {
      reservations.forEach(r => knownResIds.add(String(r.id)));
      initialResLoaded = true;
    } else {
      const newRes = reservations.filter(r => !knownResIds.has(String(r.id)));
      if (newRes.length > 0) {
        playChime();
        const newest = newRes[0];
        toast(`🔔 New table booking from ${newest?.name || 'Guest'} (${newest?.guests || '2'} guests)!`);
        newRes.forEach(r => knownResIds.add(String(r.id)));
      }
    }
    renderActiveSection(true);
  }

  function processIncomingMessages(messages, isInitial = false) {
    if (!Array.isArray(messages)) return;
    state.messages = messages;
    updateBadges();

    if (isInitial || !initialMsgLoaded) {
      messages.forEach(m => knownMsgIds.add(String(m.id)));
      initialMsgLoaded = true;
    } else {
      const newMsgs = messages.filter(m => !knownMsgIds.has(String(m.id)));
      if (newMsgs.length > 0) {
        playChime();
        const newest = newMsgs[0];
        toast(`🔔 New contact inquiry from ${newest?.firstName || 'Customer'}: "${newest?.subject || ''}"`);
        newMsgs.forEach(m => knownMsgIds.add(String(m.id)));
      }
    }
    renderActiveSection(true);
  }

  function processIncomingDishes(dishes) {
    if (!Array.isArray(dishes)) return;
    state.menu = dishes;
    updateBadges();
    if (state.section === 'menu' && !$('#modalBackdrop:not(.hidden)')) {
      renderMenu(true);
    } else if (state.section === 'dashboard') {
      renderDashboard(true);
    }
  }

  async function enterApp() {
    await waitForDb();
    await loadAll(true);
    await renderSection(state.section);
    setupFirestoreRealtimeListeners();
    initLiveSync();
  }

  async function loadAll(isInitial = false) {
    const results = await Promise.allSettled([
      api('/api/menu'),
      api('/api/orders'),
      api('/api/reservations'),
      api('/api/messages')
    ]);
    if (results[0].status === 'fulfilled' && Array.isArray(results[0].value)) {
      processIncomingDishes(results[0].value);
    }
    if (results[1].status === 'fulfilled' && Array.isArray(results[1].value)) {
      processIncomingOrders(results[1].value, isInitial);
    }
    if (results[2].status === 'fulfilled' && Array.isArray(results[2].value)) {
      processIncomingReservations(results[2].value, isInitial);
    }
    if (results[3].status === 'fulfilled' && Array.isArray(results[3].value)) {
      processIncomingMessages(results[3].value, isInitial);
    }
    updateBadges();
  }

  function renderActiveSection(isSilent = false) {
    if (state.section === 'dashboard') renderDashboard(isSilent);
    else if (state.section === 'orders') renderOrders(isSilent);
    else if (state.section === 'reservations') renderReservations(isSilent);
    else if (state.section === 'messages') renderMessages(isSilent);
    else if (state.section === 'menu' && !$('#modalBackdrop:not(.hidden)')) renderMenu(isSilent);
  }

  function initLiveSync() {
    // Secondary light sync interval to guarantee freshness across edge network disconnects
    setInterval(() => {
      loadAll(false).catch(() => {});
    }, 8000);
  }

  function setupFirestoreRealtimeListeners() {
    const bind = () => {
      const db = window.OrientEckDb || window.dbService;
      if (!db) return false;

      if (typeof db.subscribeOrders === 'function') {
        db.subscribeOrders(orders => {
          processIncomingOrders(orders, false);
        });
      }

      if (typeof db.subscribeReservations === 'function') {
        db.subscribeReservations(reservations => {
          processIncomingReservations(reservations, false);
        });
      }

      if (typeof db.subscribeMessages === 'function') {
        db.subscribeMessages(messages => {
          processIncomingMessages(messages, false);
        });
      }

      if (typeof db.subscribeDishes === 'function') {
        db.subscribeDishes(dishes => {
          processIncomingDishes(dishes);
        });
      }

      const statusPill = $('#liveStatusText');
      if (statusPill) {
        statusPill.textContent = 'Live database sync active';
      }

      return true;
    };

    if (!bind()) {
      window.addEventListener('dbservice:ready', () => bind(), { once: true });
    }
  }

  async function updateStatus(resource,id,status){
    try{
      await api(`/api/admin/${resource}/${encodeURIComponent(id)}`,{method:'PATCH',body:JSON.stringify({status})});
      await loadAll();
      if(state.section==='dashboard') renderDashboard();
      else if(resource==='orders') renderOrders();
      else if(resource==='reservations') renderReservations();
      else renderMessages();
      toast('Status updated in database.');
    }catch(err){
      toast(err.message,true);
    }
  }

            <div class="field full">
              <label for="foodSort">Menu sort order</label>
              <input id="foodSort" name="sortOrder" type="number" step="1" value="${Number(p.sortOrder)||0}">
              <span class="hint">Lower numbers appear first on the customer website.</span>
            </div>
          </div>
          <label class="check-row">
            <input type="checkbox" name="available" ${p.available!==false?'checked':''}>
            <span><b>Available for ordering</b><br><span class="muted">Unavailable items remain visible on the site but cannot be added to cart.</span></span>
          </label>
          <label class="check-row">
            <input type="checkbox" name="visible" ${p.visible!==false?'checked':''}>
            <span><b>Show on website</b><br><span class="muted">Turn off to completely hide this item from the public site.</span></span>
          </label>
        </div>
        <div class="modal-actions">
          <div>
            ${p.id?`<button type="button" class="danger" id="modalDelete">Delete dish</button>`:''}
          </div>
          <div>
            <button type="button" class="secondary" data-modal-close>Cancel</button>
            <button class="primary" type="submit" id="saveFood">Save to database</button>
          </div>
        </div>
      </form>`;

    $('#modalBackdrop').classList.remove('hidden');
    $$('[data-modal-close]').forEach(b=>b.onclick=closeModal);

    $('#foodImageUrl').oninput=()=>{
      const url=$('#foodImageUrl').value.trim();
      if(url){
        state.modalImage=url;
        $('#imagePreview').innerHTML=`<img src="${esc(url)}" alt="Preview">`;
      }
    };

    $('#foodImageFile').onchange=()=>{
      const file=$('#foodImageFile').files[0];
      if(!file)return;
      const reader=new FileReader();
      reader.onload=()=>{
        state.modalImage=reader.result;
        $('#imagePreview').innerHTML=`<img src="${esc(reader.result)}" alt="Preview">`;
      };
      reader.readAsDataURL(file);
    };

    $('#foodForm').onsubmit=saveFoodItem;
    if(p.id)$('#modalDelete').onclick=()=>deleteFood(p.id,true);
  }

  async function saveFoodItem(e){
    e.preventDefault();
    const f=new FormData(e.target);
    const id=f.get('id');
    const name=String(f.get('name')||'').trim();
    const category=String(f.get('category')||'').trim()||'Other';
    const price=parseFloat(f.get('price'))||0;
    const quantity=parseInt(f.get('quantity'),10)||0;
    const description=String(f.get('description')||'').trim();
    const sortOrder=parseInt(f.get('sortOrder'),10)||0;
    const available=f.get('available')!==null;
    const visible=f.get('visible')!==null;

    if(!name){toast('Please provide a food name',true);return}

    const current=state.menu.find(x=>x.id===id);
    const payload={
      id:id||undefined,
      name,
      category,
      categoryId:slug(category),
      price,
      quantity,
      description,
      available,
      visible,
      sortOrder,
      payment:'Cash on delivery',
      image:state.modalImage||current?.image||'',
      variants:current?.variants||[]
    };

    try{
      $('#saveFood').setAttribute('disabled','true');
      await api('/api/admin/menu',{method:'POST',body:JSON.stringify(payload)});
      closeModal();
      state.pendingCategory='';
      await loadAll();
      if(state.section==='dashboard') renderDashboard();
      else if(state.section==='menu') renderMenu();
      else renderFoodAdd();
      toast(current?'Food item updated in database!':'New food item added to database!');
    }catch(err){
      toast(err.message,true);
    }finally{
      $('#saveFood')?.removeAttribute('disabled');
    }
  }

  async function deleteFood(id,fromModal=false){
    const item=state.menu.find(x=>x.id===id);
    if(!confirm(`Delete “${item?.name||'this food item'}” from the database and menu? This cannot be undone.`))return;
    try{
      await api('/api/admin/menu/'+encodeURIComponent(id),{method:'DELETE'});
      if(fromModal)closeModal();
      await loadAll();
      if(state.section==='dashboard') renderDashboard();
      else if(state.section==='menu') renderMenu();
      else renderFoodAdd();
      toast('Food item deleted from database.');
    }catch(err){
      toast(err.message,true);
    }
  }

  function closeModal(){
    $('#modalBackdrop').classList.add('hidden');
    state.modalImage='';
  }

  function downloadCsv(filename,headers,rows){
    const quote=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
    const csv=[headers,...rows].map(r=>r.map(quote).join(',')).join('\r\n');
    const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;
    a.download=filename;
    a.click();
    URL.revokeObjectURL(url);
  }

  $('#sideNav').onclick=e=>{
    const b=e.target.closest('[data-section]');
    if(b) selectSection(b.dataset.section);
  };

  async function refreshWorkspace(){
    try{
      toast('Syncing with live database...');
      await loadAll();
      await renderSection(state.section);
      toast('Database synced successfully!');
    }catch(err){
      toast(err.message||'Database sync failed.',true);
    }
  }
  $('#sidebarRefreshBtn').onclick=refreshWorkspace;
  $('#mobileMenu').onclick=()=>$('#appShell').classList.toggle('nav-open');
  $('#modalBackdrop').onclick=e=>{if(e.target===$('#modalBackdrop'))closeModal()};
  document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});

  (async()=>{
    try{
      await enterApp();
    }catch(err){
      console.error(err);
      toast('Connecting to live database...', true);
    }
  })();
})();
</script>
</body>
</html>
